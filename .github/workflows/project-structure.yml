name: Validar estructura del proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estructura:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura y compilar
        shell: powershell
        run: .\tests\Test-ProjectStructure.ps1
